<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToDo リスト</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e8ecf1;
      --muted: #8b9cb3;
      --accent: #5b9fd4;
      --accent-hover: #7ab8e8;
      --danger: #e06c75;
      --done: #6a9955;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: radial-gradient(ellipse 120% 80% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 32rem;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 1.5rem;
      letter-spacing: 0.02em;
    }

    .form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .form input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
    }

    .form input::placeholder {
      color: var(--muted);
    }

    .form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(91, 159, 212, 0.25);
    }

    .btn {
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0e12;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .btn-ghost:hover {
      color: var(--text);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background: rgba(224, 108, 117, 0.12);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.75rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.5rem;
      animation: enter 0.2s ease;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .item input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--done);
      cursor: pointer;
      flex-shrink: 0;
    }

    .item label {
      flex: 1;
      cursor: pointer;
      word-break: break-word;
    }

    .item.done label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>やることリスト</h1>
    <form class="form" id="form" autocomplete="off">
      <input
        type="text"
        id="input"
        placeholder="タスクを入力…"
        maxlength="200"
        aria-label="新しいタスク"
      />
      <button type="submit" class="btn btn-primary">追加</button>
    </form>
    <div class="toolbar">
      <span id="count">残り 0 件</span>
      <button type="button" class="btn btn-ghost" id="clearDone">完了を削除</button>
    </div>
    <ul id="list" aria-live="polite"></ul>
    <p class="empty" id="empty">タスクがありません。上の欄から追加してください。</p>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "simple-todo-items";

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      const countEl = document.getElementById("count");
      const clearDone = document.getElementById("clearDone");

      /** @type {{ id: string, text: string, done: boolean }[]} */
      let items = [];

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              items = parsed.filter(
                (x) =>
                  x &&
                  typeof x.id === "string" &&
                  typeof x.text === "string" &&
                  typeof x.done === "boolean"
              );
            }
          }
        } catch (_) {
          items = [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (_) {}
      }

      function uid() {
        return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
      }

      function updateEmpty() {
        empty.hidden = items.length > 0;
        list.hidden = items.length === 0;
      }

      function updateCount() {
        const left = items.filter((i) => !i.done).length;
        countEl.textContent = "残り " + left + " 件";
      }

      function render() {
        list.innerHTML = "";
        items.forEach((item) => {
          const li = document.createElement("li");
          li.className = "item" + (item.done ? " done" : "");
          li.dataset.id = item.id;

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = item.done;
          cb.id = "todo-" + item.id;
          cb.addEventListener("change", () => {
            item.done = cb.checked;
            li.classList.toggle("done", item.done);
            save();
            updateCount();
          });

          const label = document.createElement("label");
          label.htmlFor = cb.id;
          label.textContent = item.text;

          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn btn-danger";
          del.textContent = "削除";
          del.addEventListener("click", () => {
            items = items.filter((i) => i.id !== item.id);
            save();
            render();
            updateCount();
            updateEmpty();
          });

          li.appendChild(cb);
          li.appendChild(label);
          li.appendChild(del);
          list.appendChild(li);
        });
        updateEmpty();
        updateCount();
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        items.push({ id: uid(), text, done: false });
        input.value = "";
        save();
        render();
      });

      clearDone.addEventListener("click", () => {
        items = items.filter((i) => !i.done);
        save();
        render();
      });

      load();
      render();
      input.focus();
    })();
  </script>
</body>
</html>
